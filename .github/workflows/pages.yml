name: Verify and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.cjs
      - name: Prepare public files only
        run: |
          mkdir public
          cp index.html styles.css app.js sw.js manifest.webmanifest .nojekyll public/
          cp -r icons public/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Pages availability
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({ owner: context.repo.owner, repo: context.repo.repo });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice('GitHub Pages is not enabled. Enable Pages with GitHub Actions in repository Settings when your plan supports it, then run this workflow again.');
              core.setOutput('enabled', 'false');
            }
      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
